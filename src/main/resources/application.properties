spring.application.name=coma
server.port=8080

# 각자 DB 비밀번호는 application-local.properties에 작성 (Git에 올리지 않음)
spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/snack?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 서버를 켤 때마다 schema.sql, data.sql 실행
# 테스트 데이터를 유지하고 싶으면 never로 변경
spring.sql.init.mode=always
