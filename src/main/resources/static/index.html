<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>컴퓨터공학과 시험 응원 간식 신청</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 행사 목록 (1순위, 담당: 서유정) - UI: index.html, index.html-행사상태별 행사 목록 -->
    <main class="container">
        <h1>컴퓨터공학과<br>시험 응원 간식 신청</h1>

        <!-- TODO: GET /api/events 결과로 행사 카드 표시
             카드: 행사 이름, 신청 기간, 옵션별 남은 수량, 행사 상태
             status: OPEN(신청 가능) / UPCOMING(진행 예정, "아직 신청기간이 아닙니다") / CLOSED(신청 마감, "신청이 마감된 행사입니다")

        <section id="event-list"></section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/index.js"></script>
