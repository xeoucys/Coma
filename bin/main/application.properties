spring.application.name=coma
server.port=8080

# 각자 DB 비밀번호는 application-local.properties에 작성 (Git에 올리지 않음)
spring.profiles.active=local

spring.datasource.url=jdbc:mariadb://localhost:3306/coma_db
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# schema.sql, data.sql은 각자 DB 도구(HeidiSQL 등)에서 직접 실행한다.
# 서버를 켤 때 자동 실행하지 않음
spring.sql.init.mode=never
